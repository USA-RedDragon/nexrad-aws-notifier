# Sample configuration
# HTTP server configuration
http:
  # The IPv4 address to bind the HTTP server to. 0.0.0.0 is all interfaces
  ipv4_host: "0.0.0.0"
  # The IPv6 address to bind the HTTP server to. :: is all interfaces
  ipv6_host: "::"
  # The port to bind the HTTP server to. IPv4 and IPv6 share it
  port: 8080
  # IP addresses or CIDR ranges of reverse proxies trusted to set the X-Forwarded-For header
  # trusted_proxies: []
  # Origins allowed to open a websocket. An entry may be a bare host (example.com, matching any port), a host:port (example.com:8080) or a full URL (https://example.com). * allows any origin
  # cors_hosts: []
  # OpenTelemetry configuration
  tracing:
    # Enable OpenTelemetry tracing
    enabled: false
    # The OpenTelemetry collector OTLP gRPC endpoint as host:port. Required when tracing is enabled
    # otlp_endpoint: ""
  # Go pprof configuration
  pprof:
    # Enable Go pprof
    enabled: false
  # Prometheus metrics configuration
  metrics:
    # Enable the Prometheus metrics server
    enabled: false
    # The IPv4 address to bind the Prometheus metrics server to. 127.0.0.1 is localhost
    ipv4_host: "127.0.0.1"
    # The IPv6 address to bind the Prometheus metrics server to. ::1 is localhost
    ipv6_host: "::1"
    # The port to bind the Prometheus metrics server to. IPv4 and IPv6 share it
    port: 8081
